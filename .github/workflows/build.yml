name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # One source for the NDK revision: it is installed with it, built with it,
  # and — critically — the FFmpeg cache is keyed on it. Bumping the NDK in one
  # place used to leave the cache serving libraries built by the old one.
  NDK_VERSION: "29.0.14206865"

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-36" "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      # libFLAC sources are not vendored (BSD upstream, cloned at build
      # time) — required by both the decoder-flac module and the driver's
      # native engine. See docs/libs/DECODER_FLAC_BUILD.md.
      - name: Fetch libFLAC sources
        working-directory: libs/decent-media3-decoder-flac
        run: bash setup.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('libs/**/*.gradle.kts', 'libs/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests (descriptor parser, control encodings)
        working-directory: libs
        run: ./gradlew --no-daemon :decent-usb-audio-driver:testDebugUnitTest

      - name: Unit tests (FLAC seek table sanitizer)
        run: |
          g++ -std=c++11 -Wall -Werror \
            -o /tmp/seek_table_sanitize_test \
            libs/decent-media3-decoder-flac/src/test/cpp/seek_table_sanitize_test.cc
          /tmp/seek_table_sanitize_test

      # The FFmpeg build for four ABIs is cached. RESTORE ONLY here — the save
      # is a separate step below, deliberately.
      #
      # actions/cache's own post step runs on a FAILED job too. With the
      # combined action, a run that died at the third ABI still wrote a
      # two-ABI prebuilt/ under this key, and every later run then restored it,
      # skipped the build, and failed at CMake for the ABI that was never
      # built — permanently, until someone evicted the cache by hand.
      #
      # The key hashes both scripts (a corrected build script must never be
      # served artifacts produced by the old one; setup.sh pins the upstream
      # revisions) and the NDK revision that compiled them.
      - name: Restore FFmpeg build from cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: libs/decent-audio-ffmpeg/prebuilt
          key: ffmpeg-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('libs/decent-audio-ffmpeg/build-ffmpeg.sh', 'libs/decent-audio-ffmpeg/setup.sh') }}

      # The skip is gated on prebuilt/.complete, which build-ffmpeg.sh writes
      # only after the last ABI and the leak scan. A tree that merely contains
      # libavcodec.so proves nothing about the other three ABIs.
      - name: Fetch and build FFmpeg (audio-only)
        working-directory: libs/decent-audio-ffmpeg
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          if [ -f prebuilt/.complete ]; then
            echo "prebuilt/ restored from cache and complete; skipping the FFmpeg build"
            exit 0
          fi
          if [ -d prebuilt ]; then
            echo "prebuilt/ exists but carries no completion marker — rebuilding"
          fi
          bash setup.sh
          bash build-ffmpeg.sh

      # Only a build that finished is worth keeping. `if: success()` covers the
      # failure case; the marker check covers a build-ffmpeg.sh that somehow
      # returned 0 without completing.
      - name: Save FFmpeg build to cache
        if: success() && steps.ffmpeg-cache.outputs.cache-hit != 'true' && hashFiles('libs/decent-audio-ffmpeg/prebuilt/.complete') != ''
        uses: actions/cache/save@v4
        with:
          path: libs/decent-audio-ffmpeg/prebuilt
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Build release AARs
        working-directory: libs
        run: ./gradlew --no-daemon assembleRelease

      - name: Report artifact sizes
        run: |
          {
            echo '### AAR / native sizes'
            echo '```'
            ls -l libs/*/build/outputs/aar/*-release.aar | awk '{printf "%8d  %s\n", $5, $NF}'
            for aar in libs/*/build/outputs/aar/*-release.aar; do
              unzip -l "$aar" | awk -v a="$aar" '/\.so$/ {printf "%8d  %s!%s\n", $1, a, $4}'
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AARs
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: libs/*/build/outputs/aar/*-release.aar
          if-no-files-found: error

      # Maven-consumable copies of the same AARs. GitHub Packages requires
      # auth even for public reads — consumers use a PAT with read:packages.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/full-speed-uac1'
        working-directory: libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon -PpublishVersion=0.1.${{ github.run_number }} publish
          echo "Published \`cc.neonteam.decent:*:0.1.${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: libs/*/build/reports/
