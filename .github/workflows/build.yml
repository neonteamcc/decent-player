name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('libs/**/*.gradle.kts', 'libs/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests (descriptor parser, control encodings)
        working-directory: libs
        run: ./gradlew --no-daemon :decent-usb-audio-driver:testDebugUnitTest

      - name: Build release AARs
        working-directory: libs
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release AARs
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: libs/*/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: libs/*/build/reports/
