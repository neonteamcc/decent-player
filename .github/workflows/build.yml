name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      # libFLAC sources are not vendored (BSD upstream, cloned at build
      # time) — required by both the decoder-flac module and the driver's
      # native engine. See docs/libs/DECODER_FLAC_BUILD.md.
      - name: Fetch libFLAC sources
        working-directory: libs/decent-media3-decoder-flac
        run: bash setup.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('libs/**/*.gradle.kts', 'libs/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests (descriptor parser, control encodings)
        working-directory: libs
        run: ./gradlew --no-daemon :decent-usb-audio-driver:testDebugUnitTest

      - name: Unit tests (FLAC seek table sanitizer)
        run: |
          g++ -std=c++11 -Wall -Werror \
            -o /tmp/seek_table_sanitize_test \
            libs/decent-media3-decoder-flac/src/test/cpp/seek_table_sanitize_test.cc
          /tmp/seek_table_sanitize_test

      # Four ABIs of FFmpeg + LAME take tens of minutes, so the result is
      # cached. The key hashes both scripts: a corrected build script must
      # never be served artifacts produced by the old one, and setup.sh is in
      # the key because it pins the upstream revisions.
      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: libs/decent-audio-ffmpeg/prebuilt
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('libs/decent-audio-ffmpeg/build-ffmpeg.sh', 'libs/decent-audio-ffmpeg/setup.sh') }}

      # Skipped when the cache hit: build-ffmpeg.sh starts with `rm -rf
      # prebuilt`, so running it on a restored tree would throw the cache away
      # and rebuild for nothing.
      - name: Fetch and build FFmpeg (audio-only)
        working-directory: libs/decent-audio-ffmpeg
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          if [ -f prebuilt/arm64-v8a/lib/libavcodec.so ]; then
            echo "prebuilt/ restored from cache; skipping the FFmpeg build"
            exit 0
          fi
          bash setup.sh
          bash build-ffmpeg.sh

      - name: Build release AARs
        working-directory: libs
        run: ./gradlew --no-daemon assembleRelease

      - name: Report artifact sizes
        run: |
          {
            echo '### AAR / native sizes'
            echo '```'
            ls -l libs/*/build/outputs/aar/*-release.aar | awk '{printf "%8d  %s\n", $5, $NF}'
            for aar in libs/*/build/outputs/aar/*-release.aar; do
              unzip -l "$aar" | awk -v a="$aar" '/\.so$/ {printf "%8d  %s!%s\n", $1, a, $4}'
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AARs
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: libs/*/build/outputs/aar/*-release.aar
          if-no-files-found: error

      # Maven-consumable copies of the same AARs. GitHub Packages requires
      # auth even for public reads — consumers use a PAT with read:packages.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/full-speed-uac1'
        working-directory: libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon -PpublishVersion=0.1.${{ github.run_number }} publish
          echo "Published \`cc.neonteam.decent:*:0.1.${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: libs/*/build/reports/
